<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone, Reports</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;color:#0E1B2B}
.card{background:#fff;border:1px solid #E3E9EE;border-radius:16px}
.seg{display:inline-flex;align-items:center;height:40px;padding:0 16px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;background:#fff;border:1px solid #D5DEE6;color:#0F2A5C}
.mut{color:#5B6B7B}
.lbl{font-size:11px;font-weight:700;letter-spacing:.08em;color:#5B6B7B}
</style>
</helmet>
<div style="width:390px;height:844px;background:#F3F6F7;position:relative;overflow:hidden">
  <div style="background:#0F2A5C;border-radius:0 0 24px 24px;padding:14px 20px 18px"><div style="font-size:12px;color:#CFDDF5">&#8249; More</div><div style="font-size:24px;font-weight:700;color:#fff;margin-top:4px">Reports</div><div style="font-size:13px;color:#CFDDF5;margin-top:2px">November 2026</div></div>
  <div style="padding:12px 16px 0;display:flex;gap:8px;overflow:hidden"><span class="seg">This week</span><span class="seg" style="background:#0F2A5C;color:#fff;border-color:#0F2A5C">This month</span><span class="seg">This year</span></div>
  <div style="padding:12px 16px 0;display:grid;grid-template-columns:1fr 1fr;gap:10px">
    <sc-for list="{{stats}}" as="s" hint-placeholder-count="4"><div class="card" style="padding:12px 14px"><div class="mut" style="font-size:12px;font-weight:500">{{s.label}}</div><div style="font-size:24px;font-weight:700;margin-top:2px">{{s.value}}</div><div style="font-size:12px;font-weight:600;{{s.tone}}">{{s.note}}</div></div></sc-for>
  </div>
  <div style="padding:12px 16px 0"><div class="card" style="padding:14px 16px"><div class="lbl" style="margin-bottom:8px">THINGS TO WATCH</div>
    <sc-for list="{{watch}}" as="w" hint-placeholder-count="3"><div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #EEF2F5"><div style="flex:1;font-size:14px;font-weight:600">{{w.t}}<div class="mut" style="font-size:12px;font-weight:400">{{w.n}}</div></div><span style="font-size:20px;color:#5B6B7B">&#8250;</span></div></sc-for>
  </div></div>
  <div style="padding:10px 16px 0;display:flex;flex-direction:column;gap:8px"><div class="card" style="padding:14px 16px;display:flex;justify-content:space-between;font-size:14px;font-weight:600;min-height:44px;align-items:center">Collection by week <span class="mut">&#8250;</span></div><div class="card" style="padding:14px 16px;display:flex;justify-content:space-between;font-size:14px;font-weight:600;min-height:44px;align-items:center">Patients by treatment <span class="mut">&#8250;</span></div></div>
  <div style="position:absolute;left:0;bottom:0"><dc-import name="PhoneTabs" active="More" hint-size="390px,68px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      stats: [
        { label: 'New patients', value: '86', note: '+12 vs October', tone: 'color:#14532D' },
        { label: 'Appointments', value: '412', note: '9% missed', tone: 'color:#78350F' },
        { label: 'Collected', value: '₹2,84,000', note: '+8% vs October', tone: 'color:#14532D' },
        { label: 'Balance due', value: '₹1,12,500', note: '34 patients', tone: 'color:#78350F' }
      ],
      watch: [
        { t: 'Dues over 60 days', n: '4 patients · ₹8,000' },
        { t: 'Unfinished visits', n: '3 visits from last week' },
        { t: 'Patient requests', n: '2 open' }
      ]
    };
  }
}
</script>
</body>
</html>
