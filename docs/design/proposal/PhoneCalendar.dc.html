<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone, Calendar day</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;color:#0E1B2B}
button{font-family:inherit;cursor:pointer}
.card{background:#fff;border:1px solid #E3E9EE;border-radius:16px}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.mut{color:#5B6B7B}
</style>
</helmet>
<div style="width:390px;height:844px;background:#F3F6F7;position:relative;overflow:hidden">
  <div style="background:#0F2A5C;border-radius:0 0 28px 28px;padding:16px 20px 22px;color:#fff">
    <div style="display:flex;align-items:center;justify-content:space-between"><div><div style="font-size:12px;color:#CFDDF5">Calendar</div><div style="font-size:22px;font-weight:700">Sat 22 November</div></div><button style="height:44px;padding:0 18px;border-radius:12px;border:0;background:#fff;color:#0F2A5C;font-size:14px;font-weight:700">Book</button></div>
    <div style="display:flex;gap:8px;margin-top:14px"><div style="display:flex;background:rgba(255,255,255,.14);border-radius:12px;padding:3px"><span style="padding:8px 16px;border-radius:9px;background:#fff;color:#0F2A5C;font-size:13px;font-weight:700">Day</span><span style="padding:8px 16px;font-size:13px;font-weight:600;color:#fff">Week</span></div><span style="margin-left:auto;align-self:center;font-size:13px;color:#CFDDF5">18 booked · 2 open</span></div>
  </div>
  <div style="padding:12px 16px 0;display:flex;gap:8px;overflow:hidden"><sc-for list="{{days}}" as="d" hint-placeholder-count="7"><div style="{{d.style}};flex:none;width:48px;height:62px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center"><span style="font-size:11px;font-weight:600">{{d.dow}}</span><span style="font-size:18px;font-weight:700">{{d.n}}</span></div></sc-for></div>
  <div style="padding:12px 16px 0;display:flex;flex-direction:column;gap:8px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <div class="card" style="{{r.card}};padding:10px 14px;display:flex;align-items:center;gap:12px;min-height:56px">
        <div style="width:46px"><div style="font-size:15px;font-weight:700">{{r.time}}</div><div class="mut" style="font-size:11px">{{r.dur}}</div></div>
        <div style="width:4px;align-self:stretch;border-radius:4px;background:{{r.bar}}"></div>
        <div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:600">{{r.name}}</div><div class="mut" style="font-size:12px">{{r.kind}}</div></div>
        <span class="chip" style="{{r.chip}}">{{r.status}}</span>
      </div>
    </sc-for>
    <div style="border:2px dashed #B9CCEA;border-radius:16px;min-height:48px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#1E4FA3">2 open slots · 2:40 pm and 3:20 pm</div>
  </div>
  <div style="position:absolute;left:0;bottom:0"><dc-import name="PhoneTabs" active="Calendar" hint-size="390px,68px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const on = 'background:#0F2A5C;color:#fff', off = 'background:#fff;color:#0F2A5C;border:1px solid #D5DEE6';
    const days = [['Tue', 18], ['Wed', 19], ['Thu', 20], ['Fri', 21], ['Sat', 22], ['Mon', 24], ['Tue', 25]].map(([dow, n]) => ({ dow, n, style: n === 22 ? on : off }));
    const c = { done: 'background:#DCFCE7;color:#14532D', chair: 'background:#E0E7FF;color:#1E3A8A', wait: 'background:#FEF3C7;color:#78350F', booked: 'background:#EDF1F4;color:#334155' };
    const r = (time, dur, name, kind, status, chip, bar, card = '') => ({ time, dur, name, kind, status, chip: c[chip], bar, card });
    return { days, rows: [
      r('10:00', '20 min', 'Meena Joshi', 'Braces adjustment', 'Done', 'done', '#7C3AED', 'opacity:.8'),
      r('10:30', '20 min', 'Karan Yadav', 'Consultation', 'In chair', 'chair', '#1E4FA3'),
      r('11:00', '45 min', 'Rahul Sharma', 'Braces fitting', 'Waiting 12 min', 'wait', '#7C3AED', 'border-color:#1E4FA3'),
      r('11:45', '15 min', 'Neha Gupta', 'Follow-up', 'Waiting 4 min', 'wait', '#1E4FA3'),
      r('12:00', '15 min', 'Mohd. Arif', 'Retainer check · emergency', 'Booked', 'booked', '#D9622B'),
      r('12:30', '20 min', 'Pooja Mishra', 'Ortho adjustment', 'Booked', 'booked', '#7C3AED')
    ] };
  }
}
</script>
</body>
</html>
