<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone bottom tabs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:'Inter',system-ui,sans-serif}</style>
</helmet>
<nav aria-label="Main" style="width:390px;height:68px;box-sizing:border-box;background:#fff;border-top:1px solid #E3E9EE;display:flex;padding:8px 6px 0;font-family:'Inter',system-ui,sans-serif">
  <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
    <div style="{{t.style}};flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"/></svg>{{t.label}}
    </div>
  </sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"text","default":"Today"},"$preview":{"width":390,"height":68}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'Today';
    const defs = [['Today', 'M12 7v5l3 2M21 12a9 9 0 11-18 0 9 9 0 0118 0z'], ['Patients', 'M16 8a4 4 0 10-8 0 4 4 0 008 0zM4 20c0-3.500 3.500-6 8-6s8 2.500 8 6'], ['Calendar', 'M4 7h16v13H4zM4 11h16M8 3v4M16 3v4'], ['Billing', 'M3 7h18v12H3zM3 11h18M7 15h3'], ['More', 'M5 12h.01M12 12h.01M19 12h.01']];
    return { tabs: defs.map(([label, icon]) => ({ label, icon, style: label === active ? 'color:#1E4FA3' : 'color:#5B6B7B' })) };
  }
}
</script>
</body>
</html>
