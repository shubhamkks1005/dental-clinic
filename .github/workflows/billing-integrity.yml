# 5.4.1 weekly billing money re-add (SQL on D1 export; not Worker CPU).
# Needs HEALTHCHECKS_BILLING_URL (owner). Fail ping on check failure.
name: Billing integrity

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: billing-integrity-staging
  cancel-in-progress: false

jobs:
  check-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Export staging D1 and check billing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_BACKUP }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/billing-integrity
          pnpm --filter @clinic/worker exec wrangler d1 export dental-clinic-staging \
            --env staging --output /tmp/billing-integrity/export.sql --remote
          node scripts/billing-integrity/check.mjs /tmp/billing-integrity/export.sql

      - name: Ping Healthchecks success
        if: success()
        env:
          HEALTHCHECKS_BILLING_URL: ${{ secrets.HEALTHCHECKS_BILLING_URL }}
        run: |
          if [ -n "${HEALTHCHECKS_BILLING_URL:-}" ]; then
            curl -fsS -m 30 "$HEALTHCHECKS_BILLING_URL" || true
          fi

      - name: Signal failure to Healthchecks
        if: failure()
        env:
          HEALTHCHECKS_BILLING_URL: ${{ secrets.HEALTHCHECKS_BILLING_URL }}
        run: |
          if [ -n "${HEALTHCHECKS_BILLING_URL:-}" ]; then
            curl -fsS -m 30 "${HEALTHCHECKS_BILLING_URL}/fail" || true
          fi
